
syntax = "proto3";

option java_multiple_files = true;
option java_package = "deti.sd.moss.infra.rpc.object";
option java_outer_classname = "ObjectProto";

package deti.sd.doss.infra.rpc;

service Object {
  rpc put(ProtoPutRequest) returns (ProtoPutReply) {}
  rpc get(ProtoGetRequest) returns (ProtoGetReply) {}
  rpc list(ProtoListRequest) returns (ProtoListReply) {}
  rpc remove(ProtoRemoveRequest) returns (ProtoRemoveReply) {}
}

message ProtoPutRequest {
  string bucket = 1;
  string path = 2;
  bytes data = 3;
}

message ProtoPutReply {
  int32 status = 1;
}

message ProtoGetRequest {
  string bucket = 1;
  string path = 2;
}

message ProtoGetReply {
  int32 status = 1;
  bytes data = 2;
}

message ProtoListRequest {
  string bucket = 1;
}

message ProtoRemoveRequest {
  string bucket = 1;
  string path = 2;
}

message ProtoRemoveReply {
  int32 status = 1;
}

message ProtoListReply {
  message ProtoObjectInfo {
    string path = 1;
    int32 size = 2;
    int64 timestamp = 3;
  }

  int32 status = 1;
  repeated ProtoObjectInfo objects = 2;
}

