# Configuration is used during test execution

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.com.ua.rtmp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:8090
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Security Configuration - Disable OAuth2 for tests
spring.security.oauth2.resourceserver.enabled=false
spring.security.oauth2.resourceserver.jwt.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.client.registration.clear=true

spring.cors.allowed-origins=http://localhost:3000

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

logging.level.com.ua.rtmp=DEBUG
logging.level.org.springframework.security=DEBUG

server.port=0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.test.database.replace=none

# Flagsmith Configuration - Mock values for testing
flagsmith.api.url=http://localhost:8098/api/v1/
flagsmith.environment.key=test-environment-key

# Allow bean definition overriding for test configurations
spring.main.allow-bean-definition-overriding=true