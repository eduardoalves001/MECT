# Base application configuration
spring.application.name=rtmp
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Development-specific configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true

# Security configurations (relaxed for development)
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Actuator - expose more endpoints for development
management.endpoints.web.exposure.include=health,info,metrics,beans,env,configprops,mappings
management.endpoint.health.show-details=always

# Server configuration
server.port=${SERVER_PORT:8080}

# Development database settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# CORS - configurable via environment variables
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.web.cors.allowed-methods=${CORS_ALLOWED_METHODS}
spring.web.cors.allowed-headers=${CORS_ALLOWED_HEADERS}
spring.web.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}

# Keycloak OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}

# Keycloak Admin Configuration
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.admin-username=${KEYCLOAK_ADMIN}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD}

# Flagsmith Configuration
flagsmith.api.url=${FLAGSMITH_API_URL}
flagsmith.environment.key=${FLAGSMITH_ENVIRONMENT_KEY}

# Google AI Gemini Configuration
langchain4j.google-ai-gemini.chat-model.api-key=${GOOGLE_AI_GEMINI_API_KEY}
langchain4j.google-ai-gemini.chat-model.model-name=${GOOGLE_AI_GEMINI_MODEL_NAME:gemini-2.5-flash}
langchain4j.google-ai-gemini.chat-model.temperature=0.7
langchain4j.google-ai-gemini.chat-model.max-output-tokens=2000
langchain4j.google-ai-gemini.chat-model.log-requests=true
langchain4j.google-ai-gemini.chat-model.log-responses=true

# Redis Configuration
redis.host=${REDIS_HOST:redis}
redis.port=${REDIS_PORT:6379}

# Swagger UI path
springdoc.swagger-ui.path=/docs
