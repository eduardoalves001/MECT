services:
  backend:
    build:
      context: ./backend
    container_name: rtmp-backend-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - CORS_ALLOWED_ORIGIN=${FRONTEND_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_JWK_SET_URI=${KEYCLOAK_JWK_SET_URI}
      - FLAGSMITH_API_URL=${FLAGSMITH_API_URL}
      - FLAGSMITH_ENVIRONMENT_KEY=${FLAGSMITH_ENVIRONMENT_KEY}
      - GOOGLE_AI_GEMINI_API_KEY=${GOOGLE_AI_GEMINI_API_KEY}
      - GOOGLE_AI_GEMINI_MODEL_NAME=${GOOGLE_AI_GEMINI_MODEL_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - ${BACKEND_PORT}:8080

  frontend:
    build:
      context: ./frontend
    container_name: rtmp-frontend
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT}:5173
    volumes:
      - ./frontend:/usr/app:Z
      - ./frontend/node_modules:/usr/app/node_modules
    environment:
      - VITE_BACKEND_URL=${BACKEND_URL}
      - VITE_KEYCLOAK_URL=${KEYCLOAK_URL}
      - VITE_KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - VITE_KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - VITE_FLAGSMITH_API_URL=${FLAGSMITH_API_URL}
      - VITE_FLAGSMITH_ENVIRONMENT_KEY=${FLAGSMITH_ENVIRONMENT_KEY}

  db:
    image: postgres:16.2
    container_name: db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: rtmp-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/keycloak
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HEALTH_ENABLED=true
    ports:
      - ${KEYCLOAK_PORT}:8080
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:Z
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - ${PGADMIN_PORT}:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  flagsmith:
    image: flagsmith/flagsmith:latest
    container_name: rtmp-flagsmith
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/flagsmith
      - DJANGO_ALLOWED_HOSTS=*
      - ALLOW_ADMIN_INITIATION_VIA_CLI=True
    ports:
      - ${FLAGSMITH_PORT}:8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    container_name: rtmp-redis
    restart: unless-stopped
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cypress:
    image: cypress/included:13.17.0
    container_name: rtmp-cypress
    network_mode: host
    environment:
      - CYPRESS_baseUrl=${E2E_BASE_URL}
      - CYPRESS_apiUrl=${E2E_API_URL}
      - CYPRESS_keycloakUrl=${E2E_KEYCLOAK_URL}
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e:Z
    entrypoint: cypress run
    profiles: ["test"]
    shm_size: '2gb'


volumes:
  db_data:
  pgadmin_data:
  keycloak_data:
  redis_data:
