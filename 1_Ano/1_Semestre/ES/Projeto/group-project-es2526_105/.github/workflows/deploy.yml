name: CD - Deployment

on:
  workflow_run:
    workflows: ["CD - Build and Publish Docker Images"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'
        type: string

env:
  SCRIPTS_DIR: './scripts'
  TERRAFORM_DIR: './deployments/terraform'
  IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
  RUNNER_CERTS_DIR: '${{ github.workspace }}/../rtmp-certs'
  DOMAIN: ${{ vars.DOMAIN }}

jobs:
  deploy:
    runs-on: [self-hosted, castanheta]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Prepare environment file
        run: |
          make prepare-env

          sed -i "s|FRONTEND_URL=.*|FRONTEND_URL=https://${{ env.DOMAIN }}|" .env
          sed -i "s|BACKEND_URL=.*|BACKEND_URL=https://${{ env.DOMAIN }}|" .env
          sed -i "s|KEYCLOAK_URL=.*|KEYCLOAK_URL=https://${{ env.DOMAIN }}/auth|" .env
          sed -i "s|FLAGSMITH_URL=.*|FLAGSMITH_URL=https://${{ env.DOMAIN }}:8098|" .env
          sed -i "s|CORS_ALLOWED_ORIGINS=.*|CORS_ALLOWED_ORIGINS=https://${{ env.DOMAIN }}|" .env
          sed -i "s|KC_HOSTNAME=.*|KC_HOSTNAME=${{ env.DOMAIN }}|" .env
          sed -i "s|KEYCLOAK_ISSUER_URI=.*|KEYCLOAK_ISSUER_URI=https://${{ env.DOMAIN }}/auth/realms/rtmp|" .env
          sed -i "s|KEYCLOAK_JWK_SET_URI=.*|KEYCLOAK_JWK_SET_URI=http://keycloak-prod:8080/auth/realms/rtmp/protocol/openid-connect/certs|" .env
          sed -i "s|FLAGSMITH_API_URL=.*|FLAGSMITH_API_URL=http://flagsmith:8000/api/v1/|" .env
          sed -i "s|FLAGSMITH_ENVIRONMENT_KEY=.*|FLAGSMITH_ENVIRONMENT_KEY=${{ secrets.FLAGSMITH_ENVIRONMENT_KEY }}|" .env
          sed -i "s|NGINX_SERVER_NAME=.*|NGINX_SERVER_NAME=${{ env.DOMAIN }}|" .env

      - name: Ensure SSL certificates exist
        run: |
          if [ ! -f "${{ env.RUNNER_CERTS_DIR }}/fullchain.pem" ] || [ ! -f "${{ env.RUNNER_CERTS_DIR }}/privkey.pem" ]; then
            echo "⚠️  SSL certificates not found on runner at: ${{ env.RUNNER_CERTS_DIR }}"
            echo "🔐 Generating new SSL certificates..."

            ${{ env.SCRIPTS_DIR }}/generate-ssl-cert.sh ${{ env.DOMAIN }}
            mkdir -p "${{ env.RUNNER_CERTS_DIR }}"
            cp ./certs/fullchain.pem "${{ env.RUNNER_CERTS_DIR }}/"
            cp ./certs/privkey.pem "${{ env.RUNNER_CERTS_DIR }}/"

            echo "✅ New certificates generated"
          else
            echo "✅ SSL certificates found"
          fi

      - name: Start infrastructure services (Database, Keycloak, Flagsmith)
        run: |
          echo "🚀 Starting infrastructure services (DB, Keycloak, Flagsmith)..."
          docker compose -f docker-compose-prod.yaml up -d db flagsmith keycloak-prod redis

      - name: Check infrastructure services health
        run: ${{ env.SCRIPTS_DIR }}/wait-for-healthy.sh db rtmp-keycloak-prod rtmp-flagsmith redis

      - name: Update Terraform variables file
        run: |
          echo "📝 Updating Terraform variables..."

          # Update terraform.tfvars with actual values
          sed -i "s|PLACEHOLDER_POSTGRES_USER|${{ secrets.POSTGRES_USER }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars
          sed -i "s|PLACEHOLDER_POSTGRES_PASSWORD|${{ secrets.POSTGRES_PASSWORD }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars
          sed -i "s|PLACEHOLDER_POSTGRES_APP_DB|rtmp_app|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars

          sed -i "s|PLACEHOLDER_FRONTEND_URL|https://${{ env.DOMAIN }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars
          sed -i "s|PLACEHOLDER_BACKEND_URL|https://${{ env.DOMAIN }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars
          sed -i "s|PLACEHOLDER_KEYCLOAK_URL|https://${{ env.DOMAIN }}/auth|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars
          sed -i "s|PLACEHOLDER_KC_HOSTNAME|${{ env.DOMAIN }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars

          sed -i "s|PLACEHOLDER_CORS_ALLOWED_ORIGINS|https://${{ env.DOMAIN }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars

          sed -i "s|PLACEHOLDER_KEYCLOAK_ISSUER_URI|https://${{ env.DOMAIN }}/auth/realms/rtmp|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars
          sed -i "s|PLACEHOLDER_KEYCLOAK_JWK_SET_URI|http://keycloak-prod:8080/auth/realms/rtmp/protocol/openid-connect/certs|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars

          sed -i "s|PLACEHOLDER_FLAGSMITH_API_URL|http://flagsmith:8000/api/v1/|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars
          sed -i "s|PLACEHOLDER_FLAGSMITH_ENVIRONMENT_KEY|${{ secrets.FLAGSMITH_ENVIRONMENT_KEY }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars

          sed -i "s|PLACEHOLDER_GOOGLE_AI_GEMINI_API_KEY|${{ secrets.GOOGLE_AI_GEMINI_API_KEY }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars
          sed -i "s|PLACEHOLDER_GOOGLE_AI_GEMINI_MODEL_NAME|${{ vars.GOOGLE_AI_GEMINI_MODEL_NAME || 'gemini-2.5-flash' }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars

          sed -i "s|PLACEHOLDER_BACKEND_IMAGE_TAG|${{ env.IMAGE_TAG }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars
          sed -i "s|PLACEHOLDER_FRONTEND_IMAGE_TAG|${{ env.IMAGE_TAG }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars

          sed -i "s|PLACEHOLDER_DOCKER_NETWORK_NAME|group-project-es2526_105_default|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars

          # OpenTelemetry & Elastic Observability Configuration
          sed -i "s|PLACEHOLDER_OTEL_EXPORTER_OTLP_ENDPOINT|${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars
          sed -i "s|PLACEHOLDER_OTEL_EXPORTER_OTLP_HEADERS|${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}|" ${{ env.TERRAFORM_DIR }}/terraform.tfvars

          echo "✅ Terraform variables updated"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull production images from GHCR
        run: |
          echo "📦 Pulling production images with tag: ${{ env.IMAGE_TAG }}..."
          docker pull ghcr.io/detiuaveiro/es2526-105-backend:${{ env.IMAGE_TAG }}
          docker pull ghcr.io/detiuaveiro/es2526-105-frontend:${{ env.IMAGE_TAG }}

      - name: Initialize Terraform
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init

      - name: Validate Terraform configuration
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform validate

      - name: Handle existing resources
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          if [ ! -f terraform.tfstate ] || [ ! -s terraform.tfstate ]; then
            echo "ℹ️  No Terraform state found - cleaning up any existing containers..."
            docker rm -f rtmp-app-db 2>/dev/null || true
            docker rm -f rtmp-backend-terraform-1 2>/dev/null || true
            docker rm -f rtmp-backend-terraform-2 2>/dev/null || true
            docker rm -f rtmp-frontend-terraform-1 2>/dev/null || true
            docker rm -f rtmp-frontend-terraform-2 2>/dev/null || true
            echo "✅ Ready for fresh deployment"
          else
            echo "✅ Terraform state exists - will update existing resources"
          fi

      - name: Apply Terraform deployment
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve

      - name: Start Nginx reverse proxy
        run: |
          echo "🚀 Starting Nginx reverse proxy..."
          # Export RUNNER_CERTS_DIR for docker-compose
          export RUNNER_CERTS_DIR="${{ env.RUNNER_CERTS_DIR }}"
          docker compose -f docker-compose-prod.yaml up -d nginx

      - name: Wait for Nginx to be healthy
        run: ${{ env.SCRIPTS_DIR }}/wait-for-healthy.sh rtmp-nginx

      - name: Wait for services to be healthy
        run: |
          echo "⏳ Waiting for services to become healthy..."
          sleep 30

          # Check backend replicas health
          for replica in 1 2; do
            echo "Checking backend replica $replica..."
            for i in {1..30}; do
              if docker exec rtmp-backend-terraform-$replica wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health 2>/dev/null; then
                echo "✅ Backend replica $replica is healthy"
                break
              fi
              echo "⏳ Waiting for backend replica $replica... ($i/30)"
              sleep 5
            done
          done

          # Check frontend replicas health
          for replica in 1 2; do
            echo "Checking frontend replica $replica..."
            for i in {1..30}; do
              if docker exec rtmp-frontend-terraform-$replica wget --no-verbose --tries=1 --spider http://localhost:80 2>/dev/null; then
                echo "✅ Frontend replica $replica is healthy"
                break
              fi
              echo "⏳ Waiting for frontend replica $replica... ($i/30)"
              sleep 5
            done
          done

          echo "✅ Nginx is managed by Docker Compose and handles load balancing"

      - name: Deployment summary
        run: |
          echo "=================================="
          echo "✅ Terraform deployment completed successfully!"
          echo "=================================="
          echo ""
          echo "�️  Deployed Image Tag: ${{ env.IMAGE_TAG }}"
          echo ""
          echo "�🌐 Application:  https://${{ env.DOMAIN }}"
          echo "📚 API Docs:     https://${{ env.DOMAIN }}/docs"
          echo "🔐 Keycloak:     https://${{ env.DOMAIN }}/auth"
          echo "🚩 Flagsmith:    http://${{ env.DOMAIN }}:8098"
          echo ""
          echo "=================================="
          echo "🔄 Load Balancing:"
          echo "   - Backend: rtmp-backend-terraform-1, rtmp-backend-terraform-2"
          echo "   - Frontend: rtmp-frontend-terraform-1, rtmp-frontend-terraform-2"
          echo "   - Strategy: Least connections (least_conn)"
          echo "=================================="
