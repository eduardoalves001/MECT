name: CD - Build and Publish Docker Images

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which semver part to bump (major, minor, patch)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Release notes (changes, features, bug fixes, etc.)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/es2526-105
  DOMAIN: ${{ vars.DOMAIN }}

jobs:
  publish:
    runs-on: [self-hosted, home-server]
    steps:
      - name: Checkout repository (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine new semver tag
        id: bump
        run: |
          NEW_TAG=$(bash .github/scripts/bump-version.sh "${{ github.event.inputs.bump || 'patch' }}")
          echo "Computed new tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

          # Extract version without 'v' prefix for Docker tags
          VERSION=${NEW_TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        env:
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          TAG="${{ steps.bump.outputs.new_tag }}"
          echo "Creating git tag $TAG"
          git config user.name "$GIT_COMMITTER_NAME"
          git config user.email "$GIT_COMMITTER_EMAIL"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.bump.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_BACKEND_URL=https://${{ env.DOMAIN }}
            VITE_KEYCLOAK_URL=https://${{ env.DOMAIN }}/auth
            VITE_KEYCLOAK_REALM=rtmp
            VITE_KEYCLOAK_CLIENT_ID=rtmp-client
            VITE_FLAGSMITH_API_URL=http://${{ env.DOMAIN }}:8098/api/v1/
            VITE_FLAGSMITH_ENVIRONMENT_KEY=${{ secrets.FLAGSMITH_ENVIRONMENT_KEY }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.bump.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output published images
        run: |
          echo "## Published Images :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Git Tag: **${{ steps.bump.outputs.new_tag }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker Images:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}-backend:${{ steps.bump.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}-frontend:${{ steps.bump.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All images also tagged as \`:latest\`" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: Release ${{ steps.bump.outputs.new_tag }}
          body: |
            ## Release ${{ steps.bump.outputs.new_tag }}

            ### Docker Images
            - Backend: `${{ env.IMAGE_PREFIX }}-backend:${{ steps.bump.outputs.version }}`
            - Frontend: `${{ env.IMAGE_PREFIX }}-frontend:${{ steps.bump.outputs.version }}`

            ### Pull Images
            ```bash
            docker pull ${{ env.IMAGE_PREFIX }}-backend:${{ steps.bump.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.bump.outputs.version }}
            ```
            ${{ github.event.inputs.release_notes != '' && format('
            ### Release Notes

            {0}', github.event.inputs.release_notes) || '' }}
          draft: false
          prerelease: false
